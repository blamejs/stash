# Static gates + suite + sandboxed suite + wiki e2e on every push/PR.
#
# Zero dependencies, dev included: there is no npm install anywhere in
# this pipeline -- the lockfile step below is a read-only dry run. Every
# third-party action is SHA-pinned with a trailing version comment.
#
# Output posture: every step's full output is shown -- no >/dev/null,
# no --quiet. Operators reading a failed run see what actually fired.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: gates + suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["24.21.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Codebase patterns
        run: node test/codebase-patterns.test.js

      - name: Source comment blocks
        run: node scripts/validate-source-comment-blocks.js

      - name: API snapshot
        run: node scripts/check-api-snapshot.js

      - name: Status lifecycle
        run: node scripts/check-status-lifecycle.js

      - name: Changelog regen check
        run: node scripts/regen-changelog.js --check

      - name: README error-code table check
        run: node scripts/regen-readme.js --check

      - name: Pack gate
        run: node scripts/check-pack-against-gitignore.js

      - name: Lockfile sync (package-lock.json matches package.json)
        # The committed lockfile describes exactly the root package -- zero
        # dependencies in any scope. `npm ci --dry-run` re-validates the
        # dependency graph against package.json without downloading or
        # writing anything; the fields npm does not assert (root name,
        # version and engines) are compared by the gate script. A drifted
        # lockfile fails at PR time, before a release tag exists to build
        # from it.
        #
        # The comparison lives in the script rather than inline here, so
        # this workflow and `npm run gates` enforce one implementation. An
        # inline copy silently lacked the engines comparison.
        run: |
          set -euo pipefail
          node scripts/check-lockfile-sync.js
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Suite
        # --expose-gc: the guard-reclamation-on-GC vector forces a collection to prove a
        # dropped Stash's stale claim guard is reaped.
        run: node --expose-gc --test

      - name: Suite under --permission (SPEC.md 13.1 invariant 2)
        run: node scripts/run-sandboxed.js

      - name: Fuzz-target smoke (targets load + seed corpus discriminates)
        run: node .clusterfuzzlite/local-smoke.js

      - name: Forbidden-token invariant (SPEC.md 13.1 invariant 1)
        run: |
          set -euo pipefail
          if grep -rnE "createCipheriv|createDecipheriv|node:sqlite" src/; then exit 1; fi
          if grep -rniE "password|passphrase" src/; then exit 1; fi
          # Key ingestion and derivation, not only the ciphers that consume a
          # key. Node 24.21.0 added createPrivateKey({ URL }) through an
          # OpenSSL STORE loader, which reads outside the fs permission scopes.
          if grep -rnE "createPrivateKey|createPublicKey|createSecretKey|createHmac|generateKey|importKey|wrapKey|deriveKey|deriveBits" src/; then exit 1; fi
          if grep -rnE "createDiffieHellman|diffieHellman|createECDH|createSign|createVerify" src/; then exit 1; fi
          if grep -rniE "decrypt|privateEncrypt|publicEncrypt|hkdf|pbkdf2|scrypt|subtle|webcrypto|openssl-store" src/; then exit 1; fi
          # Load a module by a computed name, past any import allowlist.
          if grep -rnE "getBuiltinModule|createRequire" src/; then exit 1; fi

      - name: Wiki e2e
        run: node examples/wiki/test/e2e.js

      - name: Runnable examples
        run: node scripts/run-examples.js

      - name: Doc examples (@example blocks in src/ comment blocks)
        # The comment-block validator only parse-checks an @example. This runs
        # every one of them, so a block documenting a method that was renamed or
        # an option that was removed fails here rather than in a reader's editor.
        run: node scripts/run-doc-examples.js
