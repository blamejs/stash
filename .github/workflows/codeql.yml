name: CodeQL SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: CodeQL analysis (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # CodeQL maintains a single combined language ID for JavaScript +
      # TypeScript. The store ships plain ESM JavaScript only (no build
      # step, no transpilation); the language ID picks up the .js files
      # under src/ regardless.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: javascript-typescript
          # Scope (paths) + query suite (security-extended) are inline so
          # analysis covers only the shipped product (src/) -- the npm
          # package surface -- not test/example code. security-extended
          # catches prototype pollution, command injection, ReDoS, unsafe
          # deserialization, hardcoded credentials, path traversal;
          # findings surface as SARIF in the Security tab.
          config: |
            queries:
              - uses: security-extended
            paths:
              - src
            paths-ignore:
              - "**/node_modules"

      # Auto-build is skipped because plain ESM files don't need a build
      # step; CodeQL extracts straight from source.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:javascript-typescript"
