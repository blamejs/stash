# DORMANT -- manual dispatch only. ClusterFuzzLite cannot build a JavaScript
# project at any sanitizer value: its action validates the `sanitizer` input
# against [address, memory, undefined, coverage] and rejects `none`, while the
# oss-fuzz JavaScript build refuses every one of those with "JavaScript projects
# cannot be fuzzed with sanitizers". `none` is the value an oss-fuzz
# project.yaml uses for JavaScript, so the two halves disagree and no setting
# satisfies both. The action input defaults to `address` on upstream main, so
# neither omitting it nor bumping the pin helps.
#
# The triggers are removed rather than left failing: a gate that cannot pass is
# noise that trains everyone to ignore a red check. Continuous fuzzing runs
# through .github/workflows/fuzz.yml, which drives the SAME targets under
# jazzer.js directly. These files stay so the corpus-persisting, long-run setup
# can be restored the day upstream accepts a JavaScript build.
#
# ClusterFuzzLite PR fuzzing: build the jazzer.js targets under
# .clusterfuzzlite/ and fuzz the code a pull request changes for a short
# burst. The targets hold the store's fail-closed contract on its
# untrusted-input surfaces -- hostile ref strings, hostile entry-sidecar
# bytes, and hostile tombstone-grave bytes -- so a crash here is a
# typed-verdict escape, never test noise.
#
# The fuzzing engine exists only inside the fuzz container; the library
# keeps zero dependencies, dev included, and nothing under
# .clusterfuzzlite/ ships in the npm tarball.

name: ClusterFuzzLite PR fuzzing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fuzzing:
    name: PR fuzzing (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # code-change mode pulls prior builds and corpora from run artifacts
    strategy:
      fail-fast: false
      matrix:
        # jazzer.js targets carry no native code, so the sanitizer is inert here --
        # but ClusterFuzzLite validates this input against a fixed list
        # (address / memory / undefined / coverage) and rejects "none", which is
        # the value oss-fuzz project.yaml uses. Pick the list default.
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: "code-change"
          sanitizer: ${{ matrix.sanitizer }}
